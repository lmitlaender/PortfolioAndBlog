name = "personalweb"
compatibility_date = "2025-07-31"
workers_dev = false
preview_urls = true
main = "src/index.ts"

[build]
command = "chmod a+x build.sh && ./build.sh"

[assets]
directory = "./public"
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "mitlaender.dev"
custom_domain = true

[[routes]]
pattern = "www.mitlaender.dev"
custom_domain = true