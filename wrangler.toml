name = "personalweb"
compatibility_date = "2025-07-31"
workers_dev = false
preview_urls = true

[build]
command = 'chmod a+x build.sh && ./build.sh'

[assets]
directory = "./public"
not_found_handling = "404-page"

main = "src/index.ts"

[[routes]]
pattern = "mitlaender.dev"
custom_domain = true

[[routes]]
pattern = "www.mitlaender.dev"
custom_domain = true